Settings:
  Prefix: '<dark_gray>[<green>CrazyEnchantments<dark_gray>]: '
  Toggle-Metrics: true
  Player-Info-Backup-Message: true
  Reset-Players-Max-Health: true
  Refresh-Potion-Effects-On-World-Change: false
  InvName: '&6&lМагазин &b&lCrazy Enchantments'
  Enchantment-Book-Item: BOOK
  Enchantment-Book-Glowing: true
  GUISize: 54
  CESuccessOverride: -1
  CEFailureOverride: -1
  EnchantmentBookLore:
  - '&7Drag book and drop on Item.'
  - '&7Right click for more Info.'
  - ''
  - '%description%'
  - ''
  - '&4%destroy_rate%% Destroy Chance'
  - '&a%success_rate%% Success Chance'
  LostBook:
    Item: BOOK
    Model:
      Namespace: ''
      Key: ''
    Name: '&8&l&nA Lost %category%&8&l&n Book'
    Lore:
    - '&7This book has been lost for centuries'
    - '&7It is said to be an enchantment book from %category%'
    - '&7But you must clean it off to find out what kind it is.'
    - '&7&l(&6&l!&7&l) &7Right Click to clean off.'
  Scrambler:
    Item: SUNFLOWER
    Model:
      Namespace: ''
      Key: ''
    Glowing: true
    Name: '&e&lThe Grand Scrambler'
    Lore:
    - '&7The &e&lThe Grand Scrambler &7will allow'
    - '&7you to re-roll the destroy and success rates.'
    - '&7Drag and drop it on an enchantment book'
    - '&7to get a new destroy and success rate.'
    GUI:
      Name: '&8Rolling the &eScrambler'
      Toggle: true
      Pointer:
        Item: REDSTONE_TORCH
        Model:
          Namespace: ''
          Key: ''
        Name: '&c&lPointer'
        Lore:
        - '&7Whatever percents the item lands on'
        - '&7will be the new percents on your book.'
    InGUI: false
    Slot: 1
    GUIName: '&e&lThe Grand Scrambler'
    GUILore:
    - '&7The &e&lThe Grand Scrambler &7will allow'
    - '&7you to re-roll the destroy and success rates.'
    - '&7Drag and drop it on an enchantment book'
    - '&7to get a new destroy and success rate.'
    - ''
    - '&eCost: &e&l$800'
  Slot_Crystal:
    InGUI: false
    Slot: 14
    Item: EMERALD
    Model:
      Namespace: ''
      Key: ''
    Glowing: true
    Name: '&5&lSlot &b&lCrystal'
    Lore:
    - '&7A rare crystal that is said to'
    - '&7increase the amount of enchants'
    - '&7that can be added onto an item.'
    - ''
    - '&7&l(&6&l!&7&l) &7Drag and drop on an item.'
    GUIName: '&5&lSlot &b&lCrystal'
    GUILore:
    - '&7A rare crystal that is said to'
    - '&7increase the amount of enchants'
    - '&7that can be added onto an item.'
    - ''
    - '&eCost: &e&l$500'
