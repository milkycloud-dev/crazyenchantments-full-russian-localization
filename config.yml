    InGUI: false
    Enabled: true
    Slot: 1
    Item: DIAMOND_CHESTPLATE
    Glowing: true
    Name: '&c&lGKitz'
    Lore:
    - '&b>>&7&nClick to open&b<<'
  ProtectionCrystal:
    InGUI: false
    Slot: 1
    Item: EMERALD
    Model:
      Namespace: ''
      Key: ''
    Glowing: true
    Protected: '&6Ancient Protection'
    Lose-Protection-On-Death: true
    Chance:
      Toggle: false
      Success-Chance: 75
    Name: '&5&lProtection &b&lCrystal'
    Lore:
    - '&7A rare crystal that is said to'
    - '&7protect items from getting lost'
    - '&7while the owners away in the after life.'
    - ''
    - '&7&l(&6&l!&7&l) &7Drag and drop on an item.'
    GUIName: '&5&lProtection &b&lCrystal'
    GUILore:
    - '&7A rare crystal that is said to'
    - '&7protect items from getting lost'
    - '&7while the owners away in the after life.'
    - ''
    - '&eCost: &e&l$500'
