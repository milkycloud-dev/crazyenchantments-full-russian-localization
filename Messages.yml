  Help:
  - <dark_green><b><u>Crazy Enchantments
  - <aqua>/ce - <blue>Открыть меню зачарований.
  - <aqua>/tinker - <blue>Открыть меню Сборщика (Тинкера).
  - <aqua>/blacksmith - <blue>Открыть меню Кузнеца.
  - <aqua>/gkitz [набор] [игрок] - <blue>Открыть меню G-Наборов или получить набор.
  - <aqua>/gkitz reset <набор> [игрок] - <blue>Сбросить перезарядку G-Набора.
  - <aqua>/ce help - <blue>Показать список всех команд.
  - <aqua>/ce debug - <blue>Выполнить быструю диагностику ошибок.
  - <aqua>/ce info [зачарование] - <blue>Просмотреть информацию о чарах.
  - <aqua>/ce reload - <blue>Перезагрузить все файлы конфигурации.
  - <aqua>/ce remove <зачарование> - <blue>Снять зачарование с предмета в руке.
  - <aqua>/ce add <зачарование> [уровень] - <blue>Добавить зачарование на предмет
    в руке.
  - <aqua>/ce scroll <black/white/transmog> [кол-во] [игрок] - <blue>Выдать свиток.
  - <aqua>/ce crystal [кол-во] [игрок] - <blue>Выдать кристалл защиты.
  - <aqua>/ce scrambler [кол-во] [игрок] - <blue>Выдать перемешиватель.
  - <aqua>/ce dust <success/destroy/mystery> [кол-во] [игрок] [процент] - <blue>Выдать
    пыль.
  - <aqua>/ce book <зачарование> [уровень] [кол-во] [игрок] - <blue>Выдать книгу чар.
  - <aqua>/ce lostbook <категория> [кол-во] [игрок] - <blue>Выдать потерянную книгу.
  - <aqua>/ce spawn <зачарование/категория> [параметры] - <blue>Заспавнить книгу на
    координатах.
